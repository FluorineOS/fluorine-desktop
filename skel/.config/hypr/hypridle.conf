# FluorineOS hypridle configuration.
#
# Daily-driver idle policy: dim the panel first, lock before the workstation
# is left unattended, and suspend only when running on battery power.
#
# hyprlang syntax is required here; only the compositor uses Lua.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 minutes: dim the backlight and remember the previous level. Systems with
# no backlight device, such as virtual machines, skip this silently.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10% 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || true
}

# 10 minutes: lock the session.
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock
}

# 20 minutes: suspend, but only while the machine is discharging. A desktop
# or a machine on AC power stays awake with the session locked.
listener {
    timeout = 1200
    on-timeout = sh -c 'grep -qs Discharging /sys/class/power_supply/*/status && systemctl suspend'
}
