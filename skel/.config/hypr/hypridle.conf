# FluorineOS 0.0.1 hypridle configuration.
#
# OLED burn-in protection: dim early, lock before the panel sits on a static
# image for long, and power the panel down last.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 2 minutes: dim the backlight and remember the previous level.
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 minutes: lock the session with hyprlock.
listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

# 6 minutes: turn the panel off entirely.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
