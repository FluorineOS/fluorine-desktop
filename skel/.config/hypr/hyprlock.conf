# FluorineOS 0.0.1 hyprlock configuration.
#
# Pure AMOLED black background, lime focus ring, muted slate text, and a red
# ring when authentication fails.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(000000ff)
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    rounding = 6
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = Password
    font_family = JetBrains Mono
    font_color = rgba(e2e8f0ff)
    inner_color = rgba(0a0d10ff)
    outer_color = rgba(b4f03aff)
    check_color = rgba(b4f03aff)
    fail_color = rgba(f85149ff)
    fail_text = Authentication failed
}

label {
    monitor =
    text = FluorineOS
    color = rgba(e2e8f0ff)
    font_family = JetBrains Mono
    font_size = 14
    position = 0, 80
    halign = center
    valign = center
}
