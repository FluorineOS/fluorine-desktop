# FluorineOS hyprlock configuration.
#
# AMOLED Void: #000000 canvas over the dimmed active wallpaper, #0A0D10 input
# panel, 1.5px #1C2229 idle frame, #B4F03A ring while authenticating, #FF4D4D
# ring on failure, and muted #6E7681 status text.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# The shipped 4K wordmark wallpaper is the default lock background. flr-wall
# rewrites this path when the session wallpaper changes, so the lock screen
# follows the desktop. No blur is applied: the wallpapers are already near-black.
background {
    monitor =
    path = /usr/share/backgrounds/fluorine/wall1.png
    blur_passes = 0
    color = rgba(000000ff)
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 0
    dots_size = 0.18
    dots_spacing = 0.32
    dots_center = true
    fade_on_empty = false
    placeholder_text = Enter passphrase
    font_family = JetBrains Mono
    font_color = rgba(e2e8f0ff)
    inner_color = rgba(0a0d10ff)
    outer_color = rgba(1c2229ff)
    check_color = rgba(b4f03aff)
    fail_color = rgba(f85149ff)
    capslock_color = rgba(d29922ff)
    fail_text = Authentication failed
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(e2e8f0ff)
    font_family = Inter
    font_size = 132
    position = 0, 210
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(6e7681ff)
    font_family = JetBrains Mono
    font_size = 15
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = FluorineOS
    color = rgba(6e7681ff)
    font_family = JetBrains Mono
    font_size = 13
    position = 0, 96
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] awk '{print $1 "%"}' /sys/class/power_supply/BAT0/capacity 2>/dev/null
    color = rgba(6e7681ff)
    font_family = JetBrains Mono
    font_size = 13
    position = 0, 32
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(6e7681ff)
    font_family = JetBrains Mono
    font_size = 13
    position = 32, 32
    halign = left
    valign = bottom
}
