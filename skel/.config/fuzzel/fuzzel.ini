[main]
font=JetBrains Mono:size=11
prompt="> "
placeholder=Search
icons-enabled=yes
icon-theme=Fluorine
terminal=kitty
lines=12
width=40

# 8px internal padding on every edge, matching the Waybar and SwayNC rhythm.
horizontal-pad=8
vertical-pad=8
inner-pad=8

[colors]
background=#0a0d10ff
text=#e2e8f0ff
match=#b4f03aff
selection=#2a3812ff
selection-text=#e2e8f0ff
selection-match=#b4f03aff

# The idle frame is the hairline; lime belongs to the matched text, not the
# border, so the overlay does not glow when it opens.
border=#1c2229ff

[border]
# 2px is the integer stand-in for the 1.5px hairline. The radius is capped at
# the design system limit so the launcher matches the square compositor edges.
width=2
radius=2
