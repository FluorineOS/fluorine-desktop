name: Build deb

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build fluorine-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the package source
        uses: actions/checkout@v4

      # dpkg-checkbuilddeps refuses to run without build-essential, which was
      # missing, so every run aborted before compiling anything.
      - name: Install packaging tools
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dpkg-dev \
            python3 \
            shellcheck

      - name: Lint shell scripts and check Python syntax
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(bin/* tests/run-tests.sh debian/postinst debian/preinst debian/prerm debian/postrm)
          shell_checked=0
          python_checked=0
          for script in "${scripts[@]}"; do
            [ -f "${script}" ] || continue
            first_line="$(head -n 1 "${script}")"
            case "${first_line}" in
              *python*)
                python3 -m py_compile "${script}"
                python_checked=$((python_checked + 1))
                ;;
              *sh*)
                shellcheck -x "${script}"
                printf 'shellcheck clean: %s\n' "${script}"
                shell_checked=$((shell_checked + 1))
                ;;
              *)
                printf 'skipping non-shell file: %s\n' "${script}"
                ;;
            esac
          done
          printf 'checked %d shell scripts and %d Python scripts\n' \
            "${shell_checked}" "${python_checked}"

      - name: Run the regression tests
        run: bash tests/run-tests.sh

      - name: Build the package
        run: dpkg-buildpackage -us -uc -b

      - name: Inspect the built package
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(../*_*_all.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            printf 'expected one package, found %d\n' "${#debs[@]}" >&2
            exit 1
          fi
          dpkg-deb -I "${debs[0]}"
          dpkg-deb -c "${debs[0]}"
          dpkg-deb --fsys-tarfile "${debs[0]}" | tar -t >/dev/null

      - name: Collect the package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -v ../*_*_all.deb dist/

      - name: Upload the package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluorine-desktop-deb
          path: dist/*.deb
          if-no-files-found: error
